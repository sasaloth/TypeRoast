<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Type Roast ☕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8E3D6;--panel:#F3EFE4;--paper:#FFFEF8;--ink:#2B2622;--mute:#8B8174;--line:#D4CCBA;--acc:#4F7A44;--accink:#fff;--ok:#4F7A44;--bad:#B8402F;--badbg:#F5D6CF;--coffee:#6B4226;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B201D;--panel:#242A26;--paper:#2E3530;--ink:#F1EBDD;--mute:#9AA298;--line:#3C443E;--acc:#9CC47E;--accink:#1B201D;--ok:#9CC47E;--bad:#EE8576;--badbg:#573029;--coffee:#B98A62}}
:root[data-theme="dark"]{--bg:#1B201D;--panel:#242A26;--paper:#2E3530;--ink:#F1EBDD;--mute:#9AA298;--line:#3C443E;--acc:#9CC47E;--accink:#1B201D;--ok:#9CC47E;--bad:#EE8576;--badbg:#573029;--coffee:#B98A62}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Prompt','Noto Sans Thai',system-ui,sans-serif;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:14px}
h1{font-size:26px;margin:0;font-weight:700;letter-spacing:-.01em;margin-right:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;white-space:nowrap}
.chip b{font-weight:600}
.tb{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:14px}
.tb.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.rank{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-size:14px}
.bar{flex:1;height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.grid{display:grid;grid-template-columns:270px 1fr;gap:20px;align-items:start}
.side,.more{transition:opacity .3s}
body.typing .side,body.typing header,body.typing .rank,body.typing .more{opacity:.25}
h2{font-size:16px;margin:0 0 10px;font-weight:600}
.lessons{display:flex;flex-direction:column;gap:6px}
.ls{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
.ls small{display:block;color:var(--mute);font-size:12px}
.ls.cur{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.ls.lock{opacity:.5}
.st{color:var(--acc);letter-spacing:1px;white-space:nowrap}
.ticket{position:relative;background:var(--paper);border-radius:6px 6px 0 0;padding:20px 24px 34px;box-shadow:0 1px 0 var(--line),0 12px 24px -16px rgba(0,0,0,.35)}
.ticket::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:linear-gradient(-45deg,transparent 7px,var(--paper) 0) 0 0/14px 10px,linear-gradient(45deg,transparent 7px,var(--paper) 0) 0 0/14px 10px;background-repeat:repeat-x}
.th{display:flex;align-items:center;gap:10px;border-bottom:2px dashed var(--line);padding-bottom:12px;margin-bottom:14px;flex-wrap:wrap}
.th .t{margin-right:auto}
.th .t b{display:block;font-size:18px}
.th .t span{font-size:13px;color:var(--mute)}
.pbtn{background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:14px}
.pbtn:hover{border-color:var(--acc)}
.prog{display:flex;align-items:center;gap:14px;margin-bottom:10px;font-size:13px;color:var(--mute)}
.cupw{position:relative;flex:none}
.cupw::after{content:"";position:absolute;right:-12px;top:9px;width:12px;height:18px;border:3px solid var(--ink);border-left:0;border-radius:0 10px 10px 0}
.cup{position:relative;width:38px;height:44px;border:3px solid var(--ink);border-radius:3px 3px 16px 16px;overflow:hidden}
.cup i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--coffee);transition:height .15s}
.box{position:relative;cursor:text;min-height:120px}
.text{font-size:clamp(22px,4.2vw,32px);line-height:2;white-space:pre-wrap;color:var(--mute);letter-spacing:.01em}
.c.done{color:var(--ok)}
.c.cur{color:var(--ink);border-bottom:3px solid var(--acc)}
.c.bad{background:var(--badbg);color:var(--bad);border-bottom:3px solid var(--bad)}
.ghost{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;cursor:text}
.tap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--paper) 82%,transparent);font-size:15px;color:var(--mute);pointer-events:none}
.box.f .tap{display:none}
.hint{font-size:13px;color:var(--mute);margin:12px 0 0}
.kb{margin-top:16px;display:flex;flex-direction:column;gap:5px;align-items:center}
.kr{display:flex;gap:5px}
.k{width:36px;height:36px;border:1px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--panel);color:var(--mute)}
.k.sp{width:220px}
.k.nx{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.res{position:absolute;inset:0;background:var(--paper);border-radius:6px 6px 0 0;padding:24px;text-align:center;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.res[hidden]{display:none}
.res h3{margin:0;font-size:22px}
.pop{font-size:44px;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.big{font-size:22px;color:var(--acc);letter-spacing:3px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:6px 0}
.g4 b{display:block;font-size:24px}
.g4 span{font-size:12px;color:var(--mute)}
.btns{display:flex;gap:10px;margin-top:8px}
.pri{background:var(--acc);color:var(--accink);border:0;border-radius:10px;padding:9px 18px;font-weight:600}
.more{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:32px}
.ach{display:flex;flex-wrap:wrap;gap:8px}
.a{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:13px}
.a.off{opacity:.4;filter:grayscale(1)}
.chart{display:flex;gap:8px;align-items:flex-end;height:130px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mute);gap:3px}
.col i{width:100%;max-width:34px;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.set{display:flex;gap:18px;margin:-4px 0 12px;font-size:14px}.set[hidden]{display:none}.set input{vertical-align:middle;accent-color:var(--acc)}
.steam{position:absolute;left:7px;top:-24px;display:flex;gap:6px;opacity:0}.cupw.hot .steam{opacity:1}.steam i{width:4px;height:16px;border-radius:4px;background:var(--mute);animation:stm 1.6s ease-in-out infinite}.steam i:nth-child(2){animation-delay:.4s}.steam i:nth-child(3){animation-delay:.8s}
@keyframes stm{0%{transform:translateY(8px);opacity:0}50%{opacity:.55}100%{transform:translateY(-8px);opacity:0}}
.bean{position:fixed;top:-40px;z-index:8;pointer-events:none;animation:fall 2.2s ease-in forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.shr{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}.shr[hidden]{display:none}.shr .in{background:var(--panel);border-radius:14px;padding:14px;max-width:420px;text-align:center}.shr img{width:100%;border-radius:8px}.shr p{font-size:13px;color:var(--mute)}
@media(max-width:760px){.grid,.more{grid-template-columns:1fr}.kb{display:none}.main{order:-1}.ticket{padding:16px 16px 30px}.g4{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</div>

const ORD={'Light Roast':3,'Medium Roast':3,'Dark Roast':3,'Hell Roast':5},nOrd=()=>mode==='daily'?1:ORD[LS[cur].g];
const AC=[
['first','☕','แก้วแรก','First cup',s=>s.total>=1],
['perfect','🎯','เป๊ะ 100%','Perfect run',(s,r)=>r&&r.acc===100],
['s3','🔥','ติดกัน 3 วัน','3-day streak',s=>s.streak>=3],
['ten','🥐','เสิร์ฟครบ 10','10 served',s=>s.total>=10],
['hell','🌋','ผ่าน Hell Roast','Hell Roast',(s,r)=>r&&r.i===LS.length-1&&r.stars>0]];
const ROWS={en:['1234567890-=','qwertyuiop[]',"asdfghjkl;'",'zxcvbnm,./'],th:['ๅ/-ภถุึคตจขช','ๆไำพะัีรนยบล','ฟหกดเ้่าสวง','ผปแอิืทมใฝ']};
const MARK=/[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/,CLU=/[\u0E31\u0E33-\u0E3A\u0E47-\u0E4E]/;
const D=()=>({lang:'th',snd:true,vm:35,vk:50,dd:'',miss:{th:{},en:{}},xp:0,streak:0,last:'',best:{th:0,en:0},stars:{},total:0,days:{},served:{},ach:[],theme:''});
let st=D();
try{st=Object.assign(D(),JSON.parse(localStorage.getItem('tr1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('tr1',JSON.stringify(st))}catch(e){}};
const td=()=>new Date().toLocaleDateString('sv-SE');
const ago=n=>new Date(Date.now()-864e5*n).toLocaleDateString('sv-SE');
let mode='',oi=0,agg={c:0,ok:0,e:0,s:0,m:{}},lang=st.lang,cur=0,text='',chars=[],cells=[],pos=0,errs=0,ok=0,t0=null,done=false,miss={};
const L=()=>S[lang],li=lang==='th'?0:1,key=i=>lang+i;
const unlocked=i=>i===0||(st.stars[key(i-1)]||0)>=1;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)}

const recent={};
function dailyText(){const a=LS[5].p[lang].concat(LS[6].p[lang]);return a[[...td()].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7)%a.length]}
function weakText(){
 const m=st.miss[lang]||{},top=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5).map(e=>e[0]);
 if(!top.length)return '';
 const ws=new Set(),ok=/^[\p{L}\p{M}]{2,}$/u;
 LS.forEach(l=>{const w=l.w&&l.w[lang];if(Array.isArray(w))w.forEach(x=>ws.add(x));if(l.p)l.p[lang].forEach(p=>p.split(' ').forEach(x=>ok.test(x)&&ws.add(x)))});
 const all=[...ws],sh=a=>a.sort(()=>Math.random()-.5);
 return sh(all.filter(w=>top.some(t=>w.includes(t)))).concat(sh(all.slice())).filter((v,i,a)=>a.indexOf(v)===i).slice(0,6).join(' ')}
function startDaily(){mode='daily';cur=5;oi=0;agg={c:0,ok:0,e:0,s:0,m:{}};load(true)}
function startWeak(){const t=weakText();if(!t)return toast(L().noweak);mode='weak';cur=5;oi=0;agg={c:0,ok:0,e:0,s:0,m:{}};text=t;load(false)}
function beans(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<22;i++){const e=document.createElement('span');e.className='bean';e.textContent=i%3?'🫘':'☕';e.style.cssText=`left:${Math.random()*100}vw;animation-delay:${Math.random()*.8}s;font-size:${18+Math.random()*16}px`;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}}
async function shareCard(r){
 try{await document.fonts.ready}catch(e){}
 const c=document.createElement('canvas');c.width=c.height=1080;const x=c.getContext('2d'),F='Prompt,Noto Sans Thai,sans-serif';
 x.fillStyle='#E8E3D6';x.fillRect(0,0,1080,1080);x.fillStyle='#FFFEF8';x.fillRect(120,90,840,900);
 x.fillStyle='#CFC7B4';for(let i=140;i<940;i+=26)x.fillRect(i,300,14,3);
 x.textAlign='center';x.fillStyle='#2B2622';x.font='700 66px '+F;x.fillText('☕ Type Roast',540,210);
 x.fillStyle='#8B8174';x.font='500 36px '+F;x.fillText(mode==='daily'?L().daily:mode==='weak'?L().weak:LS[cur].g,540,268);
 x.fillStyle='#4F7A44';x.font='700 70px '+F;x.fillText('★'.repeat(r.stars)+'☆'.repeat(3-r.stars),540,420);
 x.fillStyle='#2B2622';x.font='700 200px '+F;x.fillText(r.sp,540,640);
 x.font='500 42px '+F;x.fillText(L().unit+'  ·  '+r.acc+'%',540,710);
 x.fillStyle='#8B8174';x.font='500 34px '+F;x.fillText(L().brew+' '+(st.served[td()]||0)+' '+L().todayo+'  🔥 '+st.streak,540,830);
 x.fillText(L().tag,540,920);
 $('#shi').src=c.toDataURL('image/png');$('#shp').textContent=L().shp;$('#shc').textContent=L().cl;$('#shr').hidden=false}
function pick(i){
 const l=LS[i];
 if(l.w){const w=l.w[lang];
  if(typeof w==='string'){const o=[];for(let k=0;k<6;k++){let c='';for(let j=0;j<4;j++)c+=w[Math.floor(Math.random()*w.length)];o.push(c)}return o.join(' ')}
  return [...w].sort(()=>Math.random()-.5).slice(0,6).join(' ')}
 const p=l.p[lang],k=key(i),r=recent[k]||(recent[k]=[]);
 let c=p.filter(x=>!r.includes(x));if(!c.length){r.length=0;c=p}
 const n=c[Math.floor(Math.random()*c.length)];r.push(n);if(r.length>Math.min(4,p.length-1))r.shift();return n}
function start(i,fresh){mode='';cur=i;oi=0;agg={c:0,ok:0,e:0,s:0,m:{}};load(fresh)}
function load(fresh){
 if(mode==='daily')text=dailyText();
 else if(mode==='weak'){if(fresh||!text)text=weakText()||text}
 else if(fresh||!text){let n,g=0;do{n=pick(cur)}while(n===text&&g++<6);text=n}
 $('.cupw').classList.remove('hot');
 chars=Array.from(text);pos=0;errs=0;ok=0;t0=null;done=false;miss={};
 document.body.classList.remove('typing');$('#res').hidden=true;
 const cl=[];chars.forEach((c,k)=>{if(CLU.test(c)&&cl.length)cl[cl.length-1].s+=c,cl[cl.length-1].n++;else cl.push({s:c,a:k,n:1})});
 $('#txt').innerHTML=cl.map(c=>`<span class="c">${c.s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</span>`).join('');
 cells=[...document.querySelectorAll('.c')].map((el,k)=>({el,a:cl[k].a,n:cl[k].n}));
 $('#tt').textContent=mode==='daily'?'📅 '+L().daily:mode==='weak'?'🎯 '+L().weak:LS[cur].g+' · '+LS[cur].t[li];
 $('#ts').textContent=L().order+(oi+1)+'/'+nOrd();
 paint();renderLessons();$('#in').focus();
}
function paint(){
 cells.forEach(c=>{c.el.className='c'+(pos>=c.a+c.n?' done':pos>=c.a?' cur':'')});
 const p=Math.round(pos/chars.length*100);
 $('#cf').style.height=p+'%';
 $('#pt').textContent=pos?p+'% · '+L().err+' '+errs:(st.total?L().fill:L().welcome);
 const nx=chars[pos];
 document.querySelectorAll('.k').forEach(k=>k.classList.toggle('nx',nx!==undefined&&(k.dataset.c===nx)));
}
function press(ch){
 if(done||(!mode&&!unlocked(cur)))return;
 if(t0===null){t0=performance.now();document.body.classList.add('typing')}
 if(ch===chars[pos]){pos++;ok++;click(0);if(pos>=chars.length){finish();return}}
 else{errs++;click(1);miss[chars[pos]]=(miss[chars[pos]]||0)+1;const c=cells.find(c=>pos>=c.a&&pos<c.a+c.n);if(c){c.el.classList.add('bad');setTimeout(()=>c.el.classList.remove('bad'),280)}}
 if(ch===chars[pos-1]&&pos<=chars.length)paint();
 else $('#pt').textContent=Math.round(pos/chars.length*100)+'% · '+L().err+' '+errs;
}
function finish(){
 done=true;paint();document.body.classList.remove('typing');
 agg.c+=chars.length;agg.ok+=ok;agg.e+=errs;agg.s+=Math.max((performance.now()-t0)/1000,.3);
 for(const k in miss)agg.m[k]=(agg.m[k]||0)+miss[k];
 if(oi+1<nOrd()){const c0=cur,o0=oi;oi++;st.total++;st.served[td()]=(st.served[td()]||0)+1;save();renderStats();setTimeout(()=>{if(cur===c0&&oi===o0+1)load(true)},500);return}
 const sec=agg.s;
 const acc=Math.round(agg.ok/(agg.ok+agg.e)*100);
 const sp=Math.round(lang==='th'?agg.c/(sec/60):agg.c/5/(sec/60));
 const stars=acc>=100?3:acc>=96?2:acc>=90?1:0;
 let xp=stars?Math.round((10+stars*5)*nOrd()/3):2;if(mode==='daily'&&stars&&st.dd!==td()){xp=20;st.dd=td()}if(mode==='weak')xp=stars?8:2;
 st.xp+=xp;st.total++;
 if(!mode)st.stars[key(cur)]=Math.max(st.stars[key(cur)]||0,stars);
 const prev=st.best[lang]||0;st.best[lang]=Math.max(prev,sp);const nb=sp>prev&&stars>0;
 if(st.last!==td()){st.streak=st.last===ago(1)?st.streak+1:1;st.last=td()}
 st.served[td()]=(st.served[td()]||0)+1;
 const dk=td()+'|'+lang,d=st.days[dk]||{s:0,a:0,n:0};d.s+=sp;d.a+=acc;d.n++;st.days[dk]=d;
 const r={acc,i:mode?-1:cur,stars};
 const mm=st.miss[lang]||(st.miss[lang]={});for(const k in agg.m)if(k!==' ')mm[k]=(mm[k]||0)+agg.m[k];
 AC.forEach(a=>{if(!st.ach.includes(a[0])&&a[4](st,r)){st.ach.push(a[0]);toast(L().newach+a[1]+' '+a[2+li])}});
 save();renderAll();
 const m=Object.entries(agg.m).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]===' '?'␣':e[0]).join('  ');
 const canNext=!mode&&cur+1<LS.length&&unlocked(cur+1);
 const res=$('#res');
 res.innerHTML=`<div class="pop">☕</div><h3>${L().done}</h3><div class="big">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
 <div class="g4"><div><b>${sp}</b><span>${L().unit}</span></div><div><b>${acc}%</b><span>${L().acc}</span></div><div><b>${agg.e}</b><span>${L().err}</span></div><div><b>${sec.toFixed(1)}</b><span>${L().sec}</span></div></div>
 <div>+${xp} XP${nb?' · '+L().nb:''}</div>${stars?'':`<div style="color:var(--bad);font-size:14px">${L().fail}</div>`}${m?`<div style="font-size:14px;color:var(--mute)">${L().miss}${m}</div>`:''}
 <div class="btns"><button class="pbtn" id="again">${L().again}</button><button class="pbtn" id="shb">${L().share}</button>${canNext?`<button class="pri" id="nxt">${L().next}</button>`:`<button class="pri" id="nxt">${L().rnd}</button>`}</div>`;
 res.hidden=false;$('.cupw').classList.add('hot');if(stars===3||nb)beans();$('#shb').onclick=()=>shareCard({sp,acc,stars});
 $('#again').onclick=()=>start(cur,true);
 $('#nxt').onclick=()=>canNext?start(cur+1,true):start(cur,true);
 $('#nxt').focus();
}
function renderLessons(){
 $('#ls').innerHTML=LS.map((l,i)=>{const s=st.stars[key(i)]||0,u=unlocked(i);
 return `<button class="ls${i===cur&&!mode?' cur':''}${u?'':' lock'}" data-i="${i}"><span>${l.t[li]}<small>${l.g}</small></span><span class="st">${u?'★'.repeat(s)+'☆'.repeat(3-s):'🔒'}</span></button>`}).join('');
 $('#bd').innerHTML=`<span>📅 ${L().daily}</span><span class="st">${st.dd===td()?'✓':''}</span>`;$('#bw').innerHTML=`<span>🎯 ${L().weak}</span>`;
 $('#bd').classList.toggle('cur',mode==='daily');$('#bw').classList.toggle('cur',mode==='weak');
 document.querySelectorAll('.lessons .ls[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(!unlocked(i))return toast(L().locked);start(i,true)});
}
function renderKb(){
 $('#kb').innerHTML=ROWS[lang].map(r=>`<div class="kr">${Array.from(r).map(c=>`<div class="k" data-c="${c}">${MARK.test(c)?'◌'+c:c}</div>`).join('')}</div>`).join('')+'<div class="kr"><div class="k sp" data-c=" "></div></div>';
}
function renderStats(){
 const sk=(st.last===td()||st.last===ago(1))?st.streak:0;
 $('#sx').textContent=st.xp;
 $('#cs').innerHTML=`🔥 <b>${sk}</b> ${L().streak}`;
 $('#cb').innerHTML=`🏆 <b>${st.best[lang]||0}</b> ${L().unit}`;
 $('#cv').innerHTML=`☕ <b>${st.served[td()]||0}</b>`;
 let r=0;RANKS.forEach((x,i)=>{if(st.xp>=x[0])r=i});
 const nx=RANKS[r+1];
 $('#rk').textContent=RANKS[r][1+li];
 $('#rb').style.width=(nx?(st.xp-RANKS[r][0])/(nx[0]-RANKS[r][0])*100:100)+'%';
 $('#rx').textContent=nx?`${st.xp}/${nx[0]} XP`:'MAX';
}
function renderMore(){
 $('#ac').innerHTML=AC.map(a=>`<span class="a${st.ach.includes(a[0])?'':' off'}">${a[1]} ${a[2+li]}</span>`).join('');
 $('#wk').textContent=L().week+' ('+L().unit+')';
 const days=[6,5,4,3,2,1,0].map(n=>{const k=ago(n),d=st.days[k+'|'+lang];return{n:new Date(k).toLocaleDateString(lang==='th'?'th-TH':'en-US',{weekday:'short'}),v:d?Math.round(d.s/d.n):0,a:d?Math.round(d.a/d.n):0}});
 const mx=Math.max(1,...days.map(d=>d.v));
 $('#ch').innerHTML=days.map(d=>`<div class="col" title="${d.a}%"><span>${d.v||''}</span><i style="height:${d.v/mx*70}%"></i><span>${d.n}</span></div>`).join('');
}
function renderAll(){renderStats();renderLessons();renderMore()}
function applyLang(){
 document.documentElement.lang=lang;
 document.querySelectorAll('[data-i]').forEach(e=>{if(S[lang][e.dataset.i]&&!e.classList.contains('ls'))e.textContent=S[lang][e.dataset.i]});
 $('#hint').textContent=L().hint;
 $('#bth').classList.toggle('on',lang==='th');$('#ben').classList.toggle('on',lang==='en');
 renderKb();renderAll();
}
function setLang(l){lang=st.lang=l;save();text='';applyLang();start(cur,true)}
$('#bth').onclick=()=>setLang('th');$('#ben').onclick=()=>setLang('en');
$('#bd').onclick=startDaily;$('#bw').onclick=startWeak;$('#shc').onclick=()=>$('#shr').hidden=true;
$('#bset').onclick=()=>{$('#set').hidden=!$('#set').hidden};
$('#vm').value=st.vm;$('#vk').value=st.vk;
$('#vm').oninput=e=>{st.vm=+e.target.value;bgm.volume=st.vm/100;save()};
$('#vk').oninput=e=>{st.vk=+e.target.value;save()};
$('#vm').onchange=$('#vk').onchange=()=>{click(0);$('#in').focus()};
const redo=f=>$('#res').hidden?load(f):start(cur,true);
$('#br').onclick=()=>redo(true);$('#bx').onclick=()=>redo(false);
$('#bthm').onclick=()=>{const r=document.documentElement,eff=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');st.theme=r.dataset.theme=eff==='dark'?'light':'dark';save()};
let ac=null;
function click(bad){
 if(!st.snd)return;
 try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
 const n=Math.floor(ac.sampleRate*.04),b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
 const o=ac.createBufferSource();o.buffer=b;
 const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=bad?300:1800+Math.random()*500;f.Q.value=1.2;
 const g=ac.createGain();g.gain.value=(bad?.3:.18)*st.vk/50;
 o.connect(f);f.connect(g);g.connect(ac.destination);o.start()}catch(e){}
}
const bsn=$('#bsn');bsn.classList.toggle('on',st.snd);
bsn.onclick=()=>{st.snd=!st.snd;save();bsn.classList.toggle('on',st.snd);if(st.snd)click(0);$('#in').focus()};
const bgm=$('#bgm');bgm.volume=st.vm/100;
$('#bmu').onclick=()=>{const b=$('#bmu');if(bgm.paused){bgm.play().then(()=>b.classList.add('on')).catch(()=>toast('🎵 ❌'))}else{bgm.pause();b.classList.remove('on')}$('#in').focus()};
if(st.theme)document.documentElement.dataset.theme=st.theme;
const inp=$('#in'),box=$('#box');
const take=()=>{const v=inp.value;inp.value='';for(const ch of v)press(ch)};
inp.addEventListener('input',e=>{if(!e.isComposing)take()});
inp.addEventListener('compositionend',take);
inp.addEventListener('focus',()=>box.classList.add('f'));
inp.addEventListener('blur',()=>box.classList.remove('f'));
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){redo(false)}
 else if(e.key==='Enter'&&done){const n=$('#nxt');if(n)n.click()}
});
applyLang();start(0,true);
</script>
</body>
</html>
